<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель статуса операций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link href="css/custom.css" rel="stylesheet">

</head>
<body class="bg-body-teritiary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#top">Панель статуса</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#metrics">Показатели</a></li>
                    <li class="nav-item"><a class="nav-link" href="#actions">Операции</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="#helpPanel" data-bs-toggle="offcanvas" role="button">Справка</a>
                    </li>
                </ul>
                <button class="btn btn-primary me-lg-3 mb-2 mb-lg-0" type="button"
                    data-bs-toggle="modal" data-bs-target="#addModal">
                Добавить запись
                </button>
                <img src="dataset/assets/avatar.svg" alt="Аватар пользователя"
                    class="rounded-circle d-none d-lg-block" width="36" height="36">
            </div>
        </div>
    </nav>
    <main class="container py-4" id="top">
        <header class="mb-4">
            <h1 class="h3 mb-1">Панель статуса операций</h1>
            <p class="text-secondary mb-0">Данные загружаются из <code>dataset/dashboard.json</code></p>
        </header>

        <div class="alert alert-danger d-none" id="dataError" role="alert"></div>

        <section id="metrics" aria-labelledby="metricsTitle">
            <h2 class="h5 mb-3" id="metricsTitle">Показатели</h2>
            <div class="row g-3" id="metricsRow"></div>
        </section>
          <div class="row g-3 mt-2">
            <section class="col-12 col-xl-8" id="actions" aria-labelledby="actionsTitle">
                <div class="card shadow-sm">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h2 class="h5 mb-0" id="actionsTitle">Последние действия</h2>
                        <button class="btn btn-outline-secondary btn-sm" type="button" id="filterBtn">
                            Показать только готовые
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">№</th>
                                    <th scope="col">Действие</th>
                                    <th scope="col">Статус</th>
                                </tr>
                            </thead>
                            <tbody id="rowsBody"></tbody>
                        </table>
                    </div>
                    <div class="card-footer text-secondary">
                        Записей: <span id="rowsCounter">0</span>
                    </div>
                </div>
            </section>

            <aside class="col-12 col-xl-4" aria-label="График">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5">Динамика</h2>
                        <img src="dataset/assets/chart.svg" alt="График активности" class="img-fluid chart-img rounded">
                    </div>
                </div>
            </aside>
        </div>

    </main>
    <footer class="container py-4 text-center text-secondary">
        Практическая работа №3 · Bootstrap 5
    </footer>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
